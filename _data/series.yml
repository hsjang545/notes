# 시리즈 탭에 나오는 파트 순서와 설명. key는 글 front matter의 series 값이다.
- key: sensor
  title: 1. 센서
  summary: 카메라, 레이더, 라이다, IMU, GNSS의 원리와 유형, 데이터의 성질.
- key: comm
  title: 2. 통신 인터페이스와 프로토콜
  summary: CAN·CAN FD, 차량 이더넷, 카메라 링크, 시리얼, ROS 2와 DDS.
- key: sync
  title: 3. 시간 동기화
  summary: NTP, PTP, GNSS+PPS의 원리와 우분투 구현, 점검 코드, 방법별 비교.
- key: calib
  title: 4. 센서 캘리브레이션
  summary: 센서별 단독 캘리브레이션과 이종 센서 간 외부 캘리브레이션, 검증.
- key: daq
  title: 5. 실차 데이터 취득 파이프라인
  summary: 여러 컴퓨터와 센서로 실차 데이터를 녹화하고 점검하고 추출하는 과정.
- key: equip
  title: 6. 장비
  summary: INS, 레이더, CAN 인터페이스와 분석 SW, 범용 DAQ, 카메라 그래버, 시험 타깃 같은 상용 장비의 구성과 설정, 데이터 형식.
- key: reg
  title: 7. 자동차 법규·표준·NCAP
  summary: UN 규정·국내 안전기준·FMVSS, ISO 26262·SOTIF·사이버보안 표준, Euro NCAP·KNCAP·C-NCAP 평가와 시험 실무.
