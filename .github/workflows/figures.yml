name: 그림 생성
# tools/figures/의 스크립트로 assets/img/ 아래 SVG를 다시 만들어 커밋한다.
# 사이트 파일은 로컬에 두지 않으므로 그림도 여기서 만든다.
on:
  push:
    branches: [main]
    paths:
      - "tools/figures/**"
  workflow_dispatch:
    inputs:
      stems:
        description: "다시 만들 글 파일명(공백으로 구분, 비우면 전부)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # 봇 커밋은 배포를 트리거하지 않으므로 배포 워크플로를 직접 실행한다

concurrency:
  group: figures
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 한글 글꼴
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum && fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 패키지
        run: pip install numpy scipy matplotlib opencv-python-headless open3d

      - name: 그림 생성
        env:
          NOTES_PY: python
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: |
          rm -rf ~/.cache/matplotlib
          bash tools/figures/build_all.sh ${{ github.event.inputs.stems }}

      - name: 바뀐 그림 커밋
        run: |
          git add assets/img
          if git diff --cached --quiet; then
            echo "바뀐 그림 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "그림 다시 생성"
          git push
          gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
